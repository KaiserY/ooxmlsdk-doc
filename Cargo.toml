[workspace]
resolver = "3"
members = [
  "listings/getting-started",
  "listings/general",
  "listings/presentation",
  "listings/spreadsheet",
  "listings/word",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bytes = "1"
ooxmlsdk = "0.13.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
